# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

name = "thermoslip-order-printer"
client_id = "9d6f5f485f916ddef3fb6a57db87a3a7"
application_url = "https://thermoslip-order-printer.fly.dev"
embedded = true

[access_scopes]
# write_orders is required for metafieldsSet on app-owned Order metafields ($app / print_status)
scopes = "write_orders"

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks"
  topics = [ "app/uninstalled", "app/scopes_update" ]

[order.metafields.app.print_status]
name = "ThermoSlip print status"
type = "single_line_text_field"

[auth]
redirect_urls = [
  "https://thermoslip-order-printer.fly.dev/auth/callback",
  "https://thermoslip-order-printer.fly.dev/auth/shopify/callback",
  "https://thermoslip-order-printer.fly.dev/api/auth"
]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
