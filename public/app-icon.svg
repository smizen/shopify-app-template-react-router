<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Ombre douce pour détacher le papier du fond -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="16" stdDeviation="20" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    
    <!-- Léger dégradé radial pour un fond lumineux mais pas "vide" -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </radialGradient>
  </defs>

  <!-- Fond Indigo vif -->
  <rect width="512" height="512" rx="112" fill="#4F46E5"/>

  <!-- Groupe principal incliné pour le dynamisme (Vol vers le haut à droite) -->
  <g transform="translate(256, 256) rotate(20) translate(-256, -256)">
    
    <!-- Les propulseurs "Jet" multicolores et énergiques -->
    <rect x="70" y="190" width="180" height="40" rx="20" fill="#FF3366"/> <!-- Rose vif -->
    <rect x="110" y="250" width="140" height="40" rx="20" fill="#FFB320"/> <!-- Jaune Soleil -->
    <rect x="150" y="310" width="100" height="40" rx="20" fill="#00D2FF"/> <!-- Bleu Électrique -->

    <!-- Le Bon de Commande (Chunky & Cute) -->
    <g filter="url(#softShadow)">
      <rect x="230" y="90" width="200" height="280" rx="24" fill="#FFFFFF"/>
      
      <!-- Code-barres minimaliste et épais (Lisible en miniature) -->
      <rect x="260" y="130" width="24" height="64" rx="8" fill="#1E293B"/>
      <rect x="296" y="130" width="12" height="64" rx="6" fill="#1E293B"/>
      <rect x="320" y="130" width="32" height="64" rx="8" fill="#1E293B"/>
      <rect x="364" y="130" width="12" height="64" rx="6" fill="#1E293B"/>
      <rect x="388" y="130" width="12" height="64" rx="6" fill="#1E293B"/>

      <!-- Lignes de texte simulées -->
      <rect x="260" y="230" width="140" height="20" rx="10" fill="#E2E8F0"/>
      <rect x="260" y="266" width="90" height="20" rx="10" fill="#E2E8F0"/>

      <!-- Point d'alerte / Validation (Vert vif) -->
      <circle cx="386" cy="276" r="14" fill="#10B981"/> 
    </g>
  </g>

  <!-- Petites étoiles/étincelles pour le côté "Friendly & Magic" -->
  <!-- Étincelle Jaune Haut-Gauche -->
  <path d="M 120 70 L 126 84 L 140 90 L 126 96 L 120 110 L 114 96 L 100 90 L 114 84 Z" fill="#FFB320"/>
  <!-- Étincelle Bleue Bas-Droite -->
  <path d="M 410 390 L 414 400 L 424 404 L 414 408 L 410 418 L 406 408 L 396 404 L 406 400 Z" fill="#00D2FF"/>
</svg>
